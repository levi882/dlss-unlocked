name: Build RTX40 Transfusion Chinese release
on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: Draft release holding validated build inputs and candidate outputs
        required: true
        default: NR-v0.9.33-RTX40-zh-CN
permissions:
  contents: write
concurrency:
  group: rtx40-transfusion-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_TAG: ${{ inputs.build_tag }}
      RELEASE_TAG: NR-v0.9.33-RTX40-zh-CN
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned upstream package and validated inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path temp_optiscaler/release-input -Force | Out-Null
          gh release download NR-v0.9.33 --repo ShyVortex/dlss-unlocked --pattern dlss-unlocked-standalone-NR-v0.9.33.zip --dir temp_optiscaler/release-input
          if ($LASTEXITCODE -ne 0) { throw 'Upstream download failed' }
          foreach ($asset in @('OptiScaler-0.9.33-Transfusion-zh-CN.zip', 'RTX40-Transfusion-components.zip')) {
            gh release download $env:BUILD_TAG --repo $env:GITHUB_REPOSITORY --pattern $asset --dir temp_optiscaler/release-input
            if ($LASTEXITCODE -ne 0) { throw "Component download failed: $asset" }
          }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build and verify standalone archive and installer
        shell: pwsh
        run: |
          $compiler = @('C:/Program Files (x86)/Inno Setup 6/ISCC.exe', 'C:/Program Files/Inno Setup 6/ISCC.exe') | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup compiler not found' }
          ./localization/package-release.ps1 -UpstreamZip temp_optiscaler/release-input/dlss-unlocked-standalone-NR-v0.9.33.zip -MenuPatchZip temp_optiscaler/release-input/OptiScaler-0.9.33-Transfusion-zh-CN.zip -Rtx40BundleZip temp_optiscaler/release-input/RTX40-Transfusion-components.zip -ISCCPath $compiler -TagName $env:RELEASE_TAG
      - name: Upload candidates to draft for review before replacement
        shell: pwsh
        run: |
          gh release upload $env:BUILD_TAG "Output/dlss-unlocked-setup-$env:RELEASE_TAG.exe" "Output/dlss-unlocked-standalone-$env:RELEASE_TAG.zip" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Candidate upload failed' }